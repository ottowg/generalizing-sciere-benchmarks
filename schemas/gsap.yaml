# GSAP Dataset Schema Definition

dataset: gsap
description: Generic Scholarly Article Processing - Fine-grained entity and relation extraction schema

entities:
  DataSource:
    description: A source of data (e.g., repository, API, collection)
    examples:
      - "Hugging Face Hub"
      - "Common Crawl"
      - "arXiv"

  Dataset:
    description: A specific, named dataset
    examples:
      - "ImageNet-1K"
      - "GLUE"
      - "MS COCO"

  DatasetGeneric:
    description: A generic reference to a dataset (not a specific named instance)
    examples:
      - "the training data"
      - "our dataset"
      - "a corpus"

  MLModel:
    description: A specific, named machine learning model
    examples:
      - "BERT-base"
      - "ResNet-50"
      - "GPT-3"

  MLModelGeneric:
    description: A generic reference to a model (not a specific named instance)
    examples:
      - "our model"
      - "the baseline"
      - "a neural network"

  Method:
    description: A technique, algorithm, or approach
    examples:
      - "backpropagation"
      - "dropout"
      - "data augmentation"

  ModelArchitecture:
    description: A model architecture or structure
    examples:
      - "transformer"
      - "convolutional neural network"
      - "encoder-decoder"

  ReferenceLink:
    description: A citation or reference to related work
    examples:
      - "[12]"
      - "Smith et al."
      - "the previous work"

  Task:
    description: A machine learning or NLP task
    examples:
      - "image classification"
      - "machine translation"
      - "question answering"

  URL:
    description: A web URL or link
    examples:
      - "https://github.com/project"
      - "www.example.com"

relations:
  appliedTo:
    description: A method or technique is applied to a dataset or task
    arguments: [Method, Dataset/Task]
    examples:
      - "data augmentation appliedTo ImageNet"

  architecture:
    description: A model has a specific architecture
    arguments: [MLModel/MLModelGeneric, ModelArchitecture]
    examples:
      - "BERT architecture transformer"

  benchmarkFor:
    description: A dataset serves as a benchmark for a task
    arguments: [Dataset, Task]
    examples:
      - "ImageNet benchmarkFor image classification"

  citation:
    description: A reference or citation relationship
    arguments: [entity, ReferenceLink]
    examples:
      - "BERT citation [12]"

  coreference:
    description: Two entities refer to the same thing
    arguments: [entity, entity]
    examples:
      - "our model coreference BERT-base"

  evaluatedOn:
    description: A model or method is evaluated on a dataset or task
    arguments: [MLModel/Method, Dataset/Task]
    examples:
      - "BERT evaluatedOn GLUE"

  generatedBy:
    description: Data or dataset is generated by a process or source
    arguments: [Dataset, DataSource/Method]
    examples:
      - "training data generatedBy web scraping"

  hasInstanceType:
    description: An entity has a specific type or instance
    arguments: [entity, entity]
    examples:
      - "our model hasInstanceType BERT"

  isBasedOn:
    description: A model or method is based on another
    arguments: [MLModel/Method, MLModel/Method]
    examples:
      - "RoBERTa isBasedOn BERT"

  isComparedTo:
    description: An entity is compared to another
    arguments: [entity, entity]
    examples:
      - "our model isComparedTo baseline"

  isHyponymOf:
    description: An entity is a type or subclass of another (hyponymy relation)
    arguments: [entity, entity]
    examples:
      - "BERT isHyponymOf transformer model"

  isPartOf:
    description: An entity is part of another entity
    arguments: [entity, entity]
    examples:
      - "encoder isPartOf transformer"

  processed:
    description: Data or dataset is processed by a method
    arguments: [Dataset, Method]
    examples:
      - "raw text processed tokenization"

  size:
    description: A dataset or model has a specific size
    arguments: [Dataset/MLModel, numeric/entity]
    examples:
      - "ImageNet size 1.2M images"

  sourcedFrom:
    description: Data or dataset is sourced from a location
    arguments: [Dataset, DataSource]
    examples:
      - "training data sourcedFrom Common Crawl"

  trainedOn:
    description: A model is trained on a dataset
    arguments: [MLModel/MLModelGeneric, Dataset]
    examples:
      - "BERT trainedOn Wikipedia"

  transformedFrom:
    description: An entity is derived or transformed from another
    arguments: [entity, entity]
    examples:
      - "fine-tuned model transformedFrom pre-trained model"

  url:
    description: An entity has an associated URL
    arguments: [entity, URL]
    examples:
      - "code url https://github.com/project"

  usedFor:
    description: A method, model, or dataset is used for a task
    arguments: [Method/MLModel/Dataset, Task]
    examples:
      - "BERT usedFor question answering"

  versionOf:
    description: An entity is a version of another entity
    arguments: [entity, entity]
    examples:
      - "BERT-large versionOf BERT"
