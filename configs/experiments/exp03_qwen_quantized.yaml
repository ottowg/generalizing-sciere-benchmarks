# Experiment 03: Qwen 2.5 quantized — 32B 4-bit vs 72B 2-bit
#
# Both models fit on a single A40 (48 GB).
#
# Run:
#   python scripts/classify_papers.py --config configs/experiments/exp03_qwen_quantized.yaml
#   python scripts/classify_papers.py --config configs/experiments/exp03_qwen_quantized.yaml --limit 10

experiments:
    - name: exp03_qwen25_32b_q4
      description: "Qwen 2.5 32B 4-bit quantized"
      model: qwen2.5:32b-instruct-q4_K_M
      base_url: http://localhost:11555
      version: v3
      methods: [with_schema]
      input: data/metadata/unified/all_papers.jsonl
      output_dir: data/classifications
      timeout: 600.0
      temperature: 0.0

    - name: exp03_qwen25_72b_q2
      description: "Qwen 2.5 72B 2-bit quantized"
      model: qwen2.5:72b-instruct-q2_K
      base_url: http://localhost:11555
      version: v3
      methods: [with_schema]
      input: data/metadata/unified/all_papers.jsonl
      output_dir: data/classifications
      timeout: 600.0
      temperature: 0.0
