# Unification Pipeline Configuration
# This file controls the behavior of the unification pipeline
# which standardizes entity annotations across different models/datasets

# Step 1: Merge stacked/overlapping mentions
merge_stacked:
    enabled: true
    # prefer_larger: If true, keep larger spans when merging overlapping mentions
    # If false, keep smaller spans
    prefer_larger: true

# Step 2: Drop unmapped labels
# Removes mentions whose labels map to null in the unified schema
drop_unmapped:
    enabled: true
    # Note: The actual label mappings are defined in label_mappings.yaml

# Step 3: Map labels to unified schema
# Transforms labels to unified schema (Dataset, Method, Task)
map_labels:
    enabled: true
    # Note: The actual label mappings are defined in label_mappings.yaml

# Step 4: Drop unmapped relations
# Removes relations whose labels map to null in the unified schema
drop_unmapped_relations:
    enabled: true
    # Note: The actual relation mappings are defined in relation_mappings.yaml

# Step 5: Map relations to unified schema
# Transforms relation labels to unified schema and applies inversion if configured
map_relations:
    enabled: true
    # Note: The actual relation mappings are defined in relation_mappings.yaml

# Step 6: Dataset-specific corrections
# Apply model/dataset-specific error corrections
dataset_corrections:
    # GSAP-specific corrections
    gsap:
        enabled: true
        # Path to the MLModelGeneric analysis JSON file
        # Can be absolute or relative to project root
        mlmodelgeneric_analysis_file: "reports/ere_confusion_analysis/unification/gsap_analysis/gsap_unmatched_mlmodelgeneric_dev_20260208_122854.json"
        # Minimum count threshold for filtering
        # Mentions appearing >= min_count times in the analysis will be filtered
        min_count: 2

    # SciER-specific corrections (placeholder for future use)
    scier:
        enabled: false
        # Add SciER-specific correction parameters here

    # SciNLP-specific corrections (placeholder for future use)
    scinlp:
        enabled: false
        # Add SciNLP-specific correction parameters here

# Step 7: Span normalization
# Strips systematic prefixes/suffixes from mention text
# (e.g., "the BERT model" -> "BERT", "GLUE benchmark" -> "GLUE")
span_normalization:
    enabled: true

# Additional pipeline settings
pipeline:
    # Verbose logging
    verbose: true
    # Generate detailed reports
    generate_reports: true
    # Output directory for reports
    report_output_dir: "reports/ere_confusion_analysis/unification/pipeline"
